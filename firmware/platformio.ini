; GTA-Watch firmware for the Waveshare ESP32-S3-Touch-AMOLED-2.06
; (ESP32-S3R8: 8MB octal PSRAM, 32MB quad flash, CO5300 410x502 AMOLED, FT3168 touch)
;
; Build/flash with the toolchain on G: (see ../README.md):
;   set PLATFORMIO_CORE_DIR=G:\GTA-Watch\.pio
;   G:\GTA-Watch\tools\pio-venv\Scripts\pio.exe run -t upload

[platformio]
default_envs = watch

[env:watch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_port = COM5
upload_port = COM5
upload_speed = 921600
lib_deps =
  lvgl/lvgl @ 9.3.0
  h2zero/NimBLE-Arduino @ ^2.3.0
  bblanchon/ArduinoJson @ ^7.2.0
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DFW_VERSION=\"1.0.0\"
build_unflags = -std=gnu++11
