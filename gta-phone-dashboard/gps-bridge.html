<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTA-Nav GPS Bridge</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #050507;
      color: #fff7dc;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.8)),
        radial-gradient(circle at 50% 0, #35312b, #050507 58%);
    }
    main {
      width: min(420px, calc(100vw - 28px));
      border: 1px solid #6f6450;
      background: #111;
      box-shadow: 0 24px 60px rgba(0,0,0,.55);
    }
    header {
      padding: 18px 20px;
      border-bottom: 2px solid #ffb000;
      background: #050505;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }
    .status {
      margin-top: 6px;
      color: #ffb000;
      font-size: 14px;
    }
    section {
      padding: 18px 20px 22px;
    }
    button {
      width: 100%;
      min-height: 54px;
      margin: 8px 0;
      border: 1px solid #7d715d;
      background: #24201a;
      color: #fff7dc;
      font-size: 17px;
      font-weight: 700;
    }
    button.primary {
      background: #f0a000;
      color: #050505;
      border-color: #ffd36b;
    }
    button:disabled {
      opacity: .45;
    }
    dl {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 10px 14px;
      margin: 18px 0 0;
      font-size: 14px;
    }
    dt {
      color: #a9a297;
    }
    dd {
      margin: 0;
      overflow-wrap: anywhere;
    }
    .note {
      margin-top: 18px;
      color: #a9a297;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>GTA-Nav</h1>
      <div id="status" class="status">Disconnected</div>
    </header>
    <section>
      <button id="connect" class="primary">Connect Watch</button>
      <button id="start" disabled>Start Live GPS</button>
      <button id="stop" disabled>Stop</button>
      <dl>
        <dt>Watch</dt><dd id="watch">none</dd>
        <dt>Latitude</dt><dd id="lat">waiting</dd>
        <dt>Longitude</dt><dd id="lon">waiting</dd>
        <dt>Speed</dt><dd id="speed">waiting</dd>
        <dt>Heading</dt><dd id="heading">waiting</dd>
        <dt>Sent</dt><dd id="sent">0</dd>
      </dl>
      <p class="note">
        Keep this page open while walking. Android Chrome supports Web Bluetooth; iPhone Safari does not expose Web Bluetooth.
      </p>
    </section>
  </main>

  <script>
    const serviceUuid = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const writeUuid = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const enc = new TextEncoder();
    let device;
    let writeChar;
    let watchId;
    let sent = 0;

    const $ = id => document.getElementById(id);
    const setStatus = text => $("status").textContent = text;

    async function connectWatch() {
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: "GTA-Nav" }],
        optionalServices: [serviceUuid]
      });
      device.addEventListener("gattserverdisconnected", () => {
        writeChar = null;
        $("start").disabled = true;
        $("stop").disabled = true;
        setStatus("Disconnected");
      });
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(serviceUuid);
      writeChar = await service.getCharacteristic(writeUuid);
      $("watch").textContent = device.name || device.id;
      $("start").disabled = false;
      setStatus("Watch connected");
    }

    function sendGps(pos) {
      if (!writeChar) return;
      const c = pos.coords;
      const speedMph = c.speed == null ? 0 : c.speed * 2.236936;
      const heading = c.heading == null || Number.isNaN(c.heading) ? 0 : c.heading;
      const msg = `GPS,${c.latitude.toFixed(7)},${c.longitude.toFixed(7)},${speedMph.toFixed(1)},${heading.toFixed(0)}`;
      writeChar.writeValueWithoutResponse(enc.encode(msg)).catch(() => setStatus("GPS send failed"));
      $("lat").textContent = c.latitude.toFixed(7);
      $("lon").textContent = c.longitude.toFixed(7);
      $("speed").textContent = `${speedMph.toFixed(1)} mph`;
      $("heading").textContent = `${heading.toFixed(0)} deg`;
      $("sent").textContent = String(++sent);
      setStatus("Streaming live GPS");
    }

    function startGps() {
      watchId = navigator.geolocation.watchPosition(sendGps, err => {
        setStatus(err.message);
      }, {
        enableHighAccuracy: true,
        maximumAge: 500,
        timeout: 8000
      });
      $("start").disabled = true;
      $("stop").disabled = false;
    }

    function stopGps() {
      if (watchId != null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      $("start").disabled = false;
      $("stop").disabled = true;
      setStatus("GPS stopped");
    }

    $("connect").addEventListener("click", () => connectWatch().catch(err => setStatus(err.message)));
    $("start").addEventListener("click", startGps);
    $("stop").addEventListener("click", stopGps);
  </script>
</body>
</html>
