<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTA-Nav Watch Simulator</title>
  <link rel="stylesheet" href="./watch-sim.css">
</head>
<body>
  <main class="sim-shell">
    <section class="watch-panel" aria-label="Watch simulator">
      <div class="watch-bezel">
        <canvas id="watchCanvas" width="410" height="502" aria-label="410 by 502 simulated watch screen"></canvas>
      </div>
      <div class="touch-pad">
        <button id="tapButton" type="button">Tap</button>
        <button id="doubleTapButton" type="button">Double Tap</button>
        <button id="swipeUpButton" type="button">Swipe Up</button>
        <button id="swipeDownButton" type="button">Swipe Down</button>
      </div>
    </section>

    <aside class="control-panel">
      <header>
        <p>GTA-Nav Lab</p>
        <h1>Watch Simulator</h1>
      </header>
      <div class="status-grid">
        <p><span>Screen</span><b id="screenStatus">Launcher</b></p>
        <p><span>Bridge</span><b id="bridgeStatus">Waiting</b></p>
        <p><span>GPS</span><b id="gpsStatus">No fix</b></p>
        <p><span>Last Command</span><b id="commandStatus">None</b></p>
      </div>

      <div class="control-group">
        <label>Screen
          <select id="screenSelect"></select>
        </label>
        <label>Heading
          <input id="headingInput" type="range" min="0" max="359" value="24">
        </label>
        <label>Battery
          <input id="batteryInput" type="range" min="0" max="100" value="78">
        </label>
      </div>

      <div class="control-group two-col">
        <button id="demoGpsButton" type="button">Send Demo GPS</button>
        <button id="routeButton" type="button">Route Demo</button>
        <button id="weatherButton" type="button">Weather Demo</button>
        <button id="fitnessButton" type="button">Fitness Demo</button>
      </div>

      <div class="control-group">
        <label>Manual command
          <input id="commandInput" placeholder="GPS,44.097327,-70.162827,0,24">
        </label>
        <button id="sendCommandButton" type="button">Send To Sim</button>
      </div>

      <pre id="log"></pre>
    </aside>
  </main>
  <script src="./watch-sim.js"></script>
</body>
</html>
